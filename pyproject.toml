[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-agent"
version = "3.1.0"
description = "AI quantitative trading system — event-driven multi-agent architecture with real financial data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.12.0",
    "tushare>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=23.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.0.0",
    "langchain>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-community>=0.3.0",
    "efinance>=0.5.8",
    "typer>=0.26.8",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
baostock = [
    "baostock>=0.9.3",
]

[project.scripts]
quant-agent = "quant_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# 内置演示样例（确定性合成数据，见 scripts/generate_demo_samples.py）随 wheel 发布，
# 使 `pip install` 后离线兜底可用。
[tool.setuptools.package-data]
quant_agent = ["data/samples/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests"]
python_files = ["test_*.py"]
# P0-03: unit/integration must never touch the network. Live data-source
# connectivity checks live under tests/smoke and are excluded by default
# (override with: uv run pytest -m smoke).
addopts = [
    "-v",
    "--tb=short",
    "--disable-socket",
    "-m", "not smoke",
]
markers = [
    "smoke: live external data-source connectivity test (requires network access)",
]
norecursedirs = ["tests/archive"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# 第三方库（pandas/typer 等）未提供类型 stub，忽略缺失导入噪音；
# 真实类型错误仍会报告。
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use broad assertions / dynamic fixtures.
"tests/**" = ["B011", "F841"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.15.21",
    "pytest-cov>=4.0.0",
]
