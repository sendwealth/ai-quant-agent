name: Release

# P4.2 发布流程：仅 tag 推送触发；在干净环境用 TestPyPI 验证安装，
# 再发布到 PyPI 并生成可校验的 release notes。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_only:
        description: "仅验证 TestPyPI 安装，不发布到 PyPI"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify-and-publish:
    name: Build, TestPyPI verify, Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra baostock

      - name: Verify gate (format/lint/type/test/build)
        run: make check

      - name: Compatibility self-check
        run: uv run python -m quant_agent.compat

      - name: License inventory
        run: uv run python scripts/license_check.py

      - name: Build distributions
        run: uv build

      - name: Publish to TestPyPI (verification)
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          if [ -n "$TEST_PYPI_TOKEN" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/ -t "$TEST_PYPI_TOKEN" dist/*
            uv pip install --system --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple ai-quant-agent || true
          else
            echo "TEST_PYPI_TOKEN 未配置，跳过 TestPyPI 安装验证"
          fi

      - name: Publish to PyPI (release)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            uv publish -t "$PYPI_TOKEN" dist/*
          else
            echo "PYPI_TOKEN 未配置，跳过 PyPI 发布"
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/* dist/SHA256SUMS \
            --title "$tag" \
            --notes "见 CHANGELOG.md 的 $tag 段。校验：dist/SHA256SUMS"
