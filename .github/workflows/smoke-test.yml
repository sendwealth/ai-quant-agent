name: Data Source Smoke Test

# P1.5 — 数据源冒烟定时工作流
# 每日 UTC 01:00 校验所有已配置数据源可达性；数据源故障会在 Summary 中告警，
# 但不阻断其它 CI（continue-on-error），避免外部 API 抖动误伤主干。

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "src/quant_agent/data/**"
      - "scripts/smoke_test_sources.py"
      - ".github/workflows/smoke-test.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project
        run: uv sync --no-dev

      - name: Run data source smoke test
        env:
          QUANT_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          QUANT_OFFLINE_MODE: "false"
        run: uv run python scripts/smoke_test_sources.py --json --no-fail

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.json
          if-no-files-found: ignore
