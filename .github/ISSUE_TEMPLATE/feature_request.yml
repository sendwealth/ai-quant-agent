name: Feature request
description: 提出一个新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 清晰描述动机与使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想的实现方式（可选）。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
